ekf_filter_node:
  ros__parameters:
    sensor_timeout: 0.01
    frequency: 100.0
    two_d_mode: true
    publish_tf: true
    world_frame: "odom"
    odom_frame: "odom" # for fusion the wheel odometry should publish to a custom frame id like wheel_odom then localization wheel pulish wheel_odom to base_link
    base_link_frame: "base_link"

    #        [x_pos   , y_pos    , z_pos,
    #         roll    , pitch    , yaw,
    #         x_vel   , y_vel    , z_vel,
    #         roll_vel, pitch_vel, yaw_vel,
    #         x_accel , y_accel  , z_accel]

    odom0: "wheel_odom_gazebo" # "wheel_odom" "wheel_odom_gazebo" 
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_queue_size: 2
    odom0_nodelay: false

    #imu_frame: "ackermann/base_link/imu_sensor"
    imu_frame: "imu_link"  #"imu_link" look at the tf tree
    imu0: "ackermann/imu"  #"/olive/imu/id01/filtered_imu" "ackermann/imu"

    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true, true, true]

    imu0_nodelay: false
    imu0_relative: false
    imu0_queue_size: 7
    imu0_pose_rejection_threshold: 0.8
    imu0_twist_rejection_threshold: 0.8
    imu0_linear_acceleration_rejection_threshold: 0.8
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    print_diagnostics: false
    debug: false
