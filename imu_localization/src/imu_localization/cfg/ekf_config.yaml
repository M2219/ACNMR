ekf_filter_node:
  ros__parameters:
    sensor_timeout: 0.01
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    world_frame: "odom"
    odom_frame: "odom" # for fusion the wheel odometry should publish to a custom frame id like wheel_odom then localization wheel pulish wheel_odom to base_link
    base_link_frame: "base_link"

    #        [x_pos   , y_pos    , z_pos,
    #         roll    , pitch    , yaw,
    #         x_vel   , y_vel    , z_vel,
    #         roll_vel, pitch_vel, yaw_vel,
    #         x_accel , y_accel  , z_accel]

    odom0: "wheel_odom_gazebo" # "wheel_odom" "wheel_odom_gazebo" 
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    #control_config: [true, false, false, false, false, true]
    odom0_nodelay: false
    odom0_differential: false
    odom0_queue_size: 4

    #imu_frame: "ackermann/base_link/imu_sensor"
    imu_frame: "ackermann/base_link/imu_sensor"  #"imu_link" # base_link # id01_base_link look at the tf tree
    imu0: "ackermann/imu"  #"/olive/imu/id01/filtered_imu" "ackermann/imu"

    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true, true, true]

    imu0_nodelay: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_pose_rejection_threshold: 0.5
    imu0_twist_rejection_threshold: 0.5
    imu0_linear_acceleration_rejection_threshold: 0.5
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    dynamic_process_noise_covariance: true

    print_diagnostics: true
    debug: true
